<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Noto Sans Kannada';
      src: url('NotoSansKannada-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans Kannada';
      src: url('NotoSansKannada-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
      padding: 40px;
      gap: 60px;
    }

    h1.page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .label {
      font-size: 0.85rem;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .size-note {
      font-size: 0.7rem;
      color: #6B7280;
      text-align: center;
      margin-bottom: 12px;
    }

    /* ══════════════════════════════════════════════════════
       DESIGN 1 — MAIN BUILDING NAME BOARD (8ft x 3ft)
       Large-scale outdoor sign for building top/facade
       Scale: 1920 x 720 px (at 96 DPI preview)
       ══════════════════════════════════════════════════════ */
    .name-board-main {
      width: 1920px;
      height: 720px;
      background: linear-gradient(135deg, #050d1a 0%, #0A2540 30%, #0F3460 65%, #0A2540 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      border: none;
    }

    /* Animated circuit-board grid background */
    .name-board-main .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(13,148,136,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,148,136,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Futuristic diagonal scan lines */
    .name-board-main .scan-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 80px,
        rgba(13,148,136,0.015) 80px,
        rgba(13,148,136,0.015) 81px
      );
    }

    /* Geometric accent circles */
    .name-board-main .geo-circle {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(13,148,136,0.08);
    }
    .name-board-main .geo-circle.gc1 { width: 600px; height: 600px; top: -200px; right: -100px; }
    .name-board-main .geo-circle.gc2 { width: 400px; height: 400px; bottom: -150px; left: -100px; border-color: rgba(249,115,22,0.06); }
    .name-board-main .geo-circle.gc3 { width: 200px; height: 200px; top: 80px; left: 120px; border-color: rgba(13,148,136,0.06); }
    .name-board-main .geo-circle.gc4 { width: 350px; height: 350px; bottom: -100px; right: 300px; border-color: rgba(255,255,255,0.02); }

    /* Glowing orbs */
    .name-board-main .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    .name-board-main .glow-orb.go1 { width: 300px; height: 300px; top: -80px; left: 25%; background: rgba(13,148,136,0.08); }
    .name-board-main .glow-orb.go2 { width: 250px; height: 250px; bottom: -60px; right: 20%; background: rgba(249,115,22,0.06); }
    .name-board-main .glow-orb.go3 { width: 200px; height: 200px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(13,148,136,0.05); }

    /* Left accent bar */
    .name-board-main .accent-bar-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(180deg, #0D9488, #14B8A6 40%, #F97316 80%, #EA580C);
    }

    /* Right accent bar */
    .name-board-main .accent-bar-right {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(180deg, #EA580C, #F97316 40%, #14B8A6 80%, #0D9488);
    }

    /* Top accent line */
    .name-board-main .accent-line-top {
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      height: 4px;
      background: linear-gradient(90deg, #0D9488 0%, #14B8A6 25%, transparent 50%, #F97316 75%, #EA580C 100%);
    }

    /* Bottom accent line */
    .name-board-main .accent-line-bottom {
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      height: 4px;
      background: linear-gradient(90deg, #EA580C 0%, #F97316 25%, transparent 50%, #14B8A6 75%, #0D9488 100%);
    }

    /* Main content area */
    .name-board-main .board-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 60px;
      padding: 0 80px;
    }

    /* Logo section */
    .name-board-main .logo-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .name-board-main .logo-container {
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Hexagonal glow behind logo */
    .name-board-main .logo-hex-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(ellipse, rgba(13,148,136,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .name-board-main .logo-container img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 30px rgba(13,148,136,0.3));
    }

    /* Separator line */
    .name-board-main .separator {
      width: 3px;
      height: 320px;
      background: linear-gradient(180deg, transparent 0%, rgba(13,148,136,0.4) 30%, rgba(13,148,136,0.6) 50%, rgba(13,148,136,0.4) 70%, transparent 100%);
      flex-shrink: 0;
      border-radius: 2px;
    }

    /* Text section */
    .name-board-main .text-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .name-board-main .company-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 7rem;
      color: #FFFFFF;
      letter-spacing: 6px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 60px rgba(13,148,136,0.2), 0 4px 8px rgba(0,0,0,0.3);
    }

    .name-board-main .company-name .hans {
      color: #FFFFFF;
    }

    .name-board-main .company-name .opticore {
      color: #14B8A6;
      text-shadow: 0 0 40px rgba(20,184,166,0.3), 0 4px 8px rgba(0,0,0,0.3);
    }

    .name-board-main .tagline-divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, #F97316 0%, #14B8A6 100%);
      border-radius: 2px;
    }

    .name-board-main .tagline {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 2rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 12px;
      text-transform: uppercase;
    }

    .name-board-main .sub-info {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-top: 8px;
    }

    .name-board-main .sub-info .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      color: #515254;
      letter-spacing: 1px;
    }

    .name-board-main .sub-info .info-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #14B8A6;
    }

    .name-board-main .sub-info .info-item .icon-text {
      color: rgba(255,255,255,0.35);
      font-size: 0.95rem;
    }

    /* Corner accents */
    .name-board-main .corner-accent {
      position: absolute;
      width: 60px;
      height: 60px;
      z-index: 5;
    }
    .name-board-main .corner-accent.tl { top: 20px; left: 20px; border-top: 2px solid rgba(13,148,136,0.3); border-left: 2px solid rgba(13,148,136,0.3); }
    .name-board-main .corner-accent.tr { top: 20px; right: 20px; border-top: 2px solid rgba(13,148,136,0.3); border-right: 2px solid rgba(13,148,136,0.3); }
    .name-board-main .corner-accent.bl { bottom: 20px; left: 20px; border-bottom: 2px solid rgba(249,115,22,0.2); border-left: 2px solid rgba(249,115,22,0.2); }
    .name-board-main .corner-accent.br { bottom: 20px; right: 20px; border-bottom: 2px solid rgba(249,115,22,0.2); border-right: 2px solid rgba(249,115,22,0.2); }


    /* ══════════════════════════════════════════════════════

    .name-board-compact .tagline-row {

    .name-board-compact .tagline-bar {

    .name-board-compact .contact-row {

    /* Corner frame accents */
    .name-board-compact .corner {

    .name-board-compact .corner.tr { top: 15px; right: 15px; border-top: 2px solid rgba(13,148,136,0.25); border-right: 2px solid rgba(13,148,136,0.25); }
    .name-board-compact .corner.bl { bottom: 15px; left: 15px; border-bottom: 2px solid rgba(249,115,22,0.15); border-left: 2px solid rgba(249,115,22,0.15); }
    .name-board-compact .corner.br { bottom: 15px; right: 15px; border-bottom: 2px solid rgba(249,115,22,0.15); border-right: 2px solid rgba(249,115,22,0.15); }

    /* ══════════════════════════════════════════════════════
       DESIGN 4 — ILLUMINATED GLOW SIGN (10ft x 3ft)
       Premium LED-style backlit sign
       Scale: 2400 x 720 px
       ══════════════════════════════════════════════════════ */
    .name-board-glow {
      width: 2400px;
      height: 720px;
      background: #020810;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 100px rgba(0,0,0,0.6), 0 0 80px rgba(13,148,136,0.08);
      border: 2px solid rgba(13,148,136,0.1);
    }

    .name-board-glow .grid-bg {
      position: absolute;
