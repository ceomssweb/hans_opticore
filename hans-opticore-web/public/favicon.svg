<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e33"/>
      <stop offset="50%" stop-color="#0f2b46"/>
      <stop offset="100%" stop-color="#143a5c"/>
    </linearGradient>
    <linearGradient id="ac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="gl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="br" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)"/>

  <!-- H letterform -->
  <rect x="17" y="17" width="7" height="30" rx="3.5" fill="url(#ac)"/>
  <rect x="40" y="17" width="7" height="30" rx="3.5" fill="url(#ac)"/>
  <rect x="17" y="28" width="30" height="7" rx="3.5" fill="url(#gl)"/>

  <!-- Mini growth bars -->
  <g opacity="0.55">
    <rect x="26" y="39" width="2.5" height="4" rx="1.25" fill="url(#br)"/>
    <rect x="30" y="37" width="2.5" height="6" rx="1.25" fill="url(#br)"/>
    <rect x="34" y="34" width="2.5" height="9" rx="1.25" fill="url(#br)"/>
    <rect x="38" y="30" width="2.5" height="13" rx="1.25" fill="url(#br)"/>
  </g>
</svg>
